<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 256 36 L 440 100 L 440 280 C 440 380 350 450 256 480 C 162 450 72 380 72 280 L 72 100 Z" 
        fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="8" filter="url(#cyanGlow)" />

  <!-- Inner Hexagon Frame -->
  <path d="M 256 80 L 390 130 L 390 270 C 390 350 320 405 256 430 C 192 405 122 350 122 270 L 122 130 Z" 
        fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Minecraft Diamond Core Accent -->
  <polygon points="256,120 280,150 256,180 232,150" fill="#00f0ff" opacity="0.8"/>

  <!-- NEXUX Bold Cyber 'N' Symbol -->
  <g filter="url(#cyanGlow)">
    <!-- Left Pillar -->
    <path d="M 160 170 L 210 170 L 210 340 L 160 340 Z" fill="url(#neonCyan)"/>
    <!-- Diagonal Bolt -->
    <path d="M 210 170 L 302 340 L 352 340 L 260 170 Z" fill="url(#neonCyan)"/>
    <!-- Right Pillar -->
    <path d="M 302 170 L 352 170 L 352 340 L 302 340 Z" fill="url(#neonCyan)"/>
    
    <!-- Accent Cyber Cuts -->
    <polygon points="160,170 210,170 185,215" fill="#ffffff" opacity="0.6"/>
    <polygon points="352,340 302,340 327,295" fill="#ffffff" opacity="0.6"/>
    <polygon points="256,255 270,230 242,280" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Bottom Cyber Glow Node -->
  <circle cx="256" cy="400" r="6" fill="#00f0ff" filter="url(#cyanGlow)"/>
</svg>

